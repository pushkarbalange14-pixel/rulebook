    // === CUSTOM HOOKS ===
    function useInView(options = {}) {
      const [ref, setRef] = useState(null);
      const [isVisible, setIsVisible] = useState(false);
      
      useEffect(() => {
        if (!ref) return;
        const observer = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) {
            setIsVisible(true);
            observer.unobserve(ref);
          }
        }, { threshold: 0.1, ...options });
        observer.observe(ref);
        return () => observer.disconnect();
      }, [ref, options]);
      
      return [setRef, isVisible];
    }

    function useScrollPosition() {
      const [scrollY, setScrollY] = useState(0);
      useEffect(() => {
        const handle = () => setScrollY(window.scrollY);
        window.addEventListener('scroll', handle, { passive: true });
        handle(); // initial check
        return () => window.removeEventListener('scroll', handle);
      }, []);
      return scrollY;
    }

    const Navbar = () => {
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [activeSection, setActiveSection] = useState('');
      
      useEffect(() => {
        const observers = [];
        const sections = NAV_ITEMS.map(item => item.id);
        
        sections.forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            const observer = new IntersectionObserver((entries) => {
              entries.forEach(entry => {
                if (entry.isIntersecting) {
                  setActiveSection(id);
                }
              });
            }, { rootMargin: '-20% 0px -80% 0px' });
            observer.observe(el);
            observers.push({ observer, el });
          }
        });
        
        return () => {
          observers.forEach(({ observer, el }) => observer.unobserve(el));
        };
      }, []);

      const scrollToSection = (e, id) => {
        e.preventDefault();
        const el = document.getElementById(id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth' });
          setMobileMenuOpen(false);

                const isExpanded = expandedRule === index;
                return (
                  <RevealWrapper key={index} delay={index % 4}>
                    <div 
                      className={`rule-item neo-card ${isExpanded ? 'expanded bg-beige' : 'bg-white'}`} 
                      style={{ cursor: 'pointer', borderLeft: isExpanded ? '4px solid #800020' : '2px solid #1a1a1a' }}
                      onClick={() => setExpandedRule(isExpanded ? null : index)}
                    >
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <div style={{ display: 'flex', gap: '1rem', alignItems: 'center' }}>
                          <span className="rule-number mono heading-md" style={{ color: '#800020' }}>{String(rule.number).padStart(2, '0')}</span>
                          <h4 className="rule-title heading-md" style={{ margin: 0 }}>{rule.title}</h4>
                        </div>
                      </div>
                      {isExpanded && (
                        <div className="rule-content" style={{ marginTop: '1rem', paddingLeft: '3.5rem' }}>
                          <p className="rule-desc body-md">{rule.description}</p>
                        </div>
                      )}
                    </div>
                  </RevealWrapper>
                )
              })}
            </div>
            
            <RevealWrapper delay={2}>
              <div className="neo-card bg-ivory" style={{ marginTop: '2rem', border: '2px dashed #1a1a1a' }}>
                <h4 className="heading-sm" style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                  <IconAlertCircle /> Important Reminder
                </h4>
                <p className="body-sm" style={{ marginTop: '0.5rem' }}>This is an official summary. The event coordinator's decision is final in all matters.</p>
              </div>
            </RevealWrapper>
          </div>
        </section>
      );
    };

    const Submission = () => {
      return (
        <section id="submission" className="submission section">
          <div className="container">
            <RevealWrapper>
              <h2 className="section-label">DELIVERABLES</h2>
              <h3 className="heading-lg" style={{ marginBottom: '3rem' }}>Final Submission</h3>
            </RevealWrapper>
            
            <div className="submission-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: '2rem' }}>
              {[
                { title: 'Follow the Theme', desc: 'Create the poster according to the assigned theme.', icon: <IconTarget /> },
                { title: 'Respect the Clock', desc: 'Follow the given time limit strictly.', icon: <IconClock /> },
                { title: 'Submit on Time', desc: 'Submit before the deadline.', icon: <IconFileText /> },
                { title: 'No Late Changes', desc: 'No modifications will be accepted after submission.', icon: <IconX /> }
              ].map((item, i) => (
                <RevealWrapper key={i} delay={i + 1} className="submission-item neo-card">
                  <div className="submission-icon" style={{ marginBottom: '1rem' }}>{item.icon}</div>
                  <h4 className="submission-item-title heading-md">{item.title}</h4>
                  <p className="submission-item-desc body-md">{item.desc}</p>
                </RevealWrapper>
              ))}
            </div>
          </div>
        </section>
      );
    };

    const JudgingCriteria = () => {
      const getIcon = (name) => {
        switch(name) {
          case 'pen': return <IconPen />;
          case 'star': return <IconStar />;
          case 'eye': return <IconEye />;
          case 'target': return <IconTarget />;
          case 'clock': return <IconClock />;
          default: return <IconStar />;
        }
      };

      return (
        <section id="judging" className="judging section bg-navy text-cream">
          <div className="container">
            <RevealWrapper>
              <h2 className="section-label" style={{ color: '#d0d0d0' }}>EVALUATION</h2>
              <h3 className="heading-lg">What Matters</h3>
              <p className="body-lg" style={{ marginBottom: '3rem' }}>These are the areas that will be considered during evaluation.</p>
            </RevealWrapper>

            <div className="judging-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '2rem' }}>
              {JUDGING_DATA.map((item, i) => (
                <RevealWrapper key={i} delay={i + 1} className="judging-card neo-card bg-cream text-navy" data-index={i + 1}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', marginBottom: '1rem' }}>
                    <div style={{ padding: '0.5rem', background: '#800020', color: '#fff', borderRadius: '4px' }}>
                      {getIcon(item.icon)}
                    </div>
                    <h4 className="judging-card-title heading-md" style={{ margin: 0 }}>{item.title}</h4>
                  </div>
                  <p className="judging-card-desc body-md">{item.description}</p>
                </RevealWrapper>
              ))}
            </div>
            
            <RevealWrapper delay={3}>
              <div className="mono label" style={{ marginTop: '3rem', textAlign: 'center', opacity: 0.8 }}>
                EVENT NOTE: These are evaluation areas, not a fixed scoring formula.
              </div>
            </RevealWrapper>
          </div>
        </section>
      );
    };

    const Disqualification = () => {
      return (
        <section id="disqualification" className="disqualification section bg-burgundy text-cream">
          <div className="container">
            <RevealWrapper>
              <div className="disqualification-header" style={{ marginBottom: '2rem' }}>
                <h2 className="section-label" style={{ color: '#f0f0f0' }}>FAIR PLAY</h2>
                <h3 className="disqualification-title display-lg">PLAY <span className="disqualification-accent" style={{ color: '#1a1a1a' }}>FAIR.</span></h3>
              </div>
              
              <div className="disqualification-content">
                <p className="disqualification-text heading-md" style={{ marginBottom: '2rem' }}>
                  This competition values honesty, effort and integrity.
                </p>
                <div style={{ display: 'flex', gap: '1rem', alignItems: 'flex-start' }}>
                  <IconShield style={{ flexShrink: 0, marginTop: '0.25rem' }} />
                  <p className="body-lg">
                    Any form of misconduct, cheating or unfair practice—including pre-written prompts, unauthorized internet use, or ignoring coordinator instructions—may result in disqualification.
                  </p>
                </div>
              </div>
              
              <div className="disqualification-note neo-card bg-cream text-burgundy" style={{ marginTop: '3rem', display: 'inline-block' }}>
                <h4 className="heading-sm">Event Note</h4>
                <p className="body-sm">The goal is fair participation, not punishment.</p>
              </div>
            </RevealWrapper>
          </div>
        </section>
      );
    };

    const Footer = () => {
      return (
        <footer className="footer section bg-ink text-cream" style={{ padding: '4rem 0' }}>
          <div className="container footer-content" style={{ textAlign: 'center' }}>
            <h2 className="footer-title display-md">PROMPT 2 POSTER</h2>
            <p className="footer-org heading-sm" style={{ marginTop: '1rem' }}>SES Polytechnic, Solapur</p>
            <p className="footer-tagline mono label" style={{ marginTop: '0.5rem', opacity: 0.7 }}>"Think it. Prompt it. Design it."</p>
            <hr className="footer-line divider-thin" style={{ borderColor: '#800020', margin: '2rem auto', maxWidth: '100px' }} />
            <p className="footer-copy body-sm" style={{ opacity: 0.5 }}>© {new Date().getFullYear()} PROMPT 2 POSTER Event.</p>
          </div>
        </footer>
      );
    };

    const BackToTop = () => {
      const scrollY = useScrollPosition();
      const isVisible = scrollY > 500;

      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <button 
          className={`back-to-top neo-btn ${isVisible ? 'visible' : ''}`}
          onClick={scrollToTop}
          aria-label="Back to top"
          style={{
            position: 'fixed',
            bottom: '2rem',
            right: '2rem',
            padding: '1rem',
            borderRadius: '50%',
            opacity: isVisible ? 1 : 0,
            pointerEvents: isVisible ? 'auto' : 'none',
            transition: 'opacity 0.3s ease',
            zIndex: 100
          }}
        >
          <IconArrowUp />
        </button>
      );
    };

    const App = () => {
      return (
        <React.Fragment>
          <Navbar />
          <main>
            <Hero />
            <EventOverview />
            <Schedule />
            <RoundSection />
            <PromptIntegrity />
            <TimeStructure />
            <Rulebook />
            <Submission />
            <JudgingCriteria />
            <Disqualification />
          </main>
          <Footer />
          <BackToTop />
        </React.Fragment>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
